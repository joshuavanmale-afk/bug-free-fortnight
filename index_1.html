<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Systems Build">

<style>
:root{
  --ink:#484848; --ink-soft:#6E6A63; --ink-faint:#A9A398;
  --gold:#BAA878; --gold-deep:#A08B58; --cta:#C7A54D;
  --paper:#FAF8F4; --card:#FFFFFF;
  --line:#E7E1D5; --line-soft:#F1ECE3;
  --rust:#A65E4E; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.45;
  padding:max(14px,env(safe-area-inset-top)) 18px calc(60px + env(safe-area-inset-bottom));
  max-width:860px; margin:0 auto; -webkit-text-size-adjust:100%;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
header{padding:12px 2px 18px}
.eyebrow{font-size:.66rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-deep)}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.015em;line-height:1.12;margin-top:5px}
.sub{font-size:.86rem;color:var(--ink-soft);margin-top:5px}

.beam-wrap{margin-top:18px}
.beam-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:12px}
.beam-count{font-size:1.02rem;font-weight:700;font-variant-numeric:tabular-nums}
.beam-count small{font-size:.74rem;font-weight:500;color:var(--ink-soft);margin-left:3px}
.beam-pct{font-size:.78rem;font-weight:600;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.beam{height:15px;background:var(--line-soft);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.beam-fill{height:100%;width:0%;background:linear-gradient(180deg,#C8B78B 0%,var(--gold) 55%,#A6905C 100%);
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:width .45s cubic-bezier(.22,.9,.35,1)}

/* tabs */
nav{display:flex;gap:6px;margin:20px 0 16px;border-bottom:1px solid var(--line)}
nav button{
  flex:1;background:none;border:none;font:inherit;font-size:.82rem;font-weight:600;
  color:var(--ink-faint);padding:9px 4px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
nav button:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-3px}

/* up next */
.upnext{
  background:linear-gradient(180deg,#FFFDF9,#FFFFFF);border:1px solid #DED2B4;
  border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;
}
.upnext .lab{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-deep)}
.upnext .t{font-size:1.02rem;font-weight:600;margin-top:4px}
.upnext .m{font-size:.79rem;color:var(--ink-soft);margin-top:3px}
.upnext button{
  margin-top:10px;background:var(--cta);color:#fff;border:none;border-radius:8px;
  font:inherit;font-size:.82rem;font-weight:600;padding:9px 18px;cursor:pointer;
}
.upnext button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* blocks */
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.block.complete{border-color:#D9CCA9}
.block-head{width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;padding:14px 15px 13px;cursor:pointer;display:block}
.block-head:focus-visible{outline:2px solid var(--gold-deep);outline-offset:-2px}
.block-top{display:flex;align-items:baseline;gap:10px}
.block-sys{font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-deep)}
.block-win{font-size:.68rem;color:var(--ink-soft);margin-left:auto;white-space:nowrap}
.block-title{font-size:1.04rem;font-weight:600;margin-top:3px;display:flex;align-items:center;gap:9px}
.count{font-size:.76rem;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chev{margin-left:auto;color:var(--ink-faint);font-size:.78rem;transition:transform .2s ease}
.block.open .chev{transform:rotate(180deg)}
.block-bar{height:4px;background:var(--line-soft);border-radius:2px;margin-top:11px;overflow:hidden}
.block-bar i{display:block;height:100%;width:0%;background:var(--gold);border-radius:2px;transition:width .35s ease}
.block.complete .block-bar i{background:var(--gold-deep)}
.block-body{display:none;border-top:1px solid var(--line-soft)}
.block.open .block-body{display:block}
.block-goal{font-size:.79rem;color:var(--ink-soft);font-style:italic;padding:11px 15px 0}

/* session */
.sess{border-top:1px solid var(--line-soft);padding:12px 15px 13px}
.sess:first-of-type{border-top:none}
.sess-head{display:flex;align-items:baseline;gap:9px;cursor:pointer}
.sess-n{font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap}
.sess-t{font-size:.94rem;font-weight:600}
.sess.done .sess-t{color:var(--ink-faint)}
.sess-c{font-size:.72rem;color:var(--ink-faint);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.sess-intro{font-size:.79rem;color:var(--ink-soft);margin:6px 0 2px;font-style:italic}
.tasks{margin-top:6px}
.task{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:7px 0}
.task:focus-visible{outline:2px solid var(--gold-deep);outline-offset:1px;border-radius:4px}
.tick{width:20px;height:20px;flex-shrink:0;margin-top:1px;border:1.5px solid #C9C2B4;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.tick svg{width:11px;height:11px;opacity:0;transition:opacity .15s}
.task.done .tick{background:var(--gold);border-color:var(--gold-deep)}
.task.done .tick svg{opacity:1}
.task span.tx{font-size:.86rem;line-height:1.4}
.task.done span.tx{color:var(--ink-faint)}
.flags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.59rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.tag.blocks{background:#F6E9E5;color:var(--rust)}
.tag.decision{background:#F2ECDE;color:var(--gold-deep)}
.tag.review{background:#E9EDE9;color:#5A6B58}
.tag.gate{background:#EDEAE3;color:var(--ink-soft)}

/* decisions log */
.logbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.logbox h2{font-size:1rem;font-weight:600;margin-bottom:3px}
.logbox p.h{font-size:.79rem;color:var(--ink-soft);margin-bottom:12px}
.logbox textarea{
  width:100%;font:inherit;font-size:.88rem;color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:10px;resize:vertical;min-height:64px;background:var(--paper);
}
.logbox textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
.logbox .add{margin-top:9px;background:var(--cta);color:#fff;border:none;border-radius:8px;font:inherit;font-size:.82rem;font-weight:600;padding:9px 18px;cursor:pointer}
.entry{border-top:1px solid var(--line-soft);padding:11px 0;display:flex;gap:10px;align-items:flex-start}
.entry .d{font-size:.68rem;color:var(--ink-faint);white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.entry .b{font-size:.87rem;flex:1;white-space:pre-wrap}
.entry .x{background:none;border:none;color:var(--ink-faint);font:inherit;font-size:1rem;cursor:pointer;padding:0 2px;line-height:1}
.empty{font-size:.82rem;color:var(--ink-faint);padding:14px 0 2px}

/* reference */
.ref{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;overflow:hidden}
.ref>button{width:100%;text-align:left;background:none;border:none;font:inherit;font-size:.95rem;font-weight:600;color:inherit;padding:13px 15px;cursor:pointer;display:flex;align-items:center}
.ref>button .chev{margin-left:auto}
.ref.open>button{border-bottom:1px solid var(--line-soft)}
.ref-body{display:none;padding:12px 15px 15px;font-size:.86rem;color:var(--ink-soft);line-height:1.55}
.ref.open .ref-body{display:block}
.ref-body strong{color:var(--ink)}
.ref-body li{margin:0 0 8px 17px}
.ref-body p{margin-bottom:9px}
.ref-body p:last-child,.ref-body li:last-child{margin-bottom:0}

/* footer */
footer{margin-top:26px;text-align:center}
.note{font-size:.72rem;color:var(--ink-faint);margin-bottom:13px;line-height:1.5}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.78rem;color:var(--ink-soft);padding:8px 15px;cursor:pointer}
.ghost:focus-visible{outline:2px solid var(--gold-deep)}
</style>
</head>

  <button id="tabRef" role="tab" aria-selected="false">Reference</button>
</nav>

      <button class="add" id="logAdd">Add decision</button>

    </div>
  </div>

  <div id="viewRef" hidden></div>
</main>

<footer>
  <div class="note" id="note"></div>
  <div class="btns">
    <button class="ghost" id="exportBtn">Export backup</button>
    <button class="ghost" id="importBtn">Import backup</button>
    <button class="ghost" id="resetBtn">Reset</button>

</footer>

{t:"How this plan works", h:`
<p><strong>Framework vs system.</strong> A framework is the documented decision layer — rules, scripts, templates, numbers, written down. A system is that framework operating: wired into monday, running without being remembered, measured. Every system goes framework → build → wire → test → review. A framework that never gets wired is documentation; wiring without a framework is automation of guesswork.</p>
<p><strong>Session rules.</strong></p>
<ol>
<li>Every session ends with something shipped or decided. If a session produces only talk, it failed.</li>
<li>Decisions get written down the moment they're made, in one line, in the log.</li>
<li>When live business eats a session, the plan slips by one session — not one week. Never compress two into one; that's how wiring gets skipped.</li>
<li>Sessions are sequenced by dependency. Don't reorder without checking what depends on what.</li>
</ol>
<p><strong>Honest calibration.</strong> 36 genuine 90-minute sessions is ambitious for one person also running the business. Realistic: 14–16 weeks at ~80% compliance. The sequence matters; the calendar doesn't.</p>`},
{t:"Where marketing lives", h:`
<p>Marketing isn't a separate workstream at this size — it's the systematic capture of what delivery and aftercare already produce (photography, reviews, raising days) and its handoff to Irons Empire and the website. It's embedded in Sessions 23, 24, 26, 27 and 33 rather than given its own sessions.</p>
<p>Brand governance — voice, visual identity — stays in the assets layer, audited in Session 33. The brochure remains a standalone project with its own blockers, including no print designer currently attached.</p>`},
{t:"Dependencies", h:`
<ul>
<li>Session 2 decisions block Sessions 4, 7, 13, 15 and 22.</li>
<li>Session 3 form identification blocks Session 15.</li>
<li>Session 7 guarantee blocks Sessions 19, 28 and the brochure.</li>
<li>Session 24 consents block published testimonials in the brochure and on the website.</li>
<li>Session 23 shot brief should precede the next KAP booking, or that shoot fills no gaps.</li>
<li>The Zapier BP pipeline must be verified before Session 8 relies on it.</li>
</ul>`},
{t:"Running in parallel (not session time)", h:`
<ul>
<li><strong>Lead-gen tracker tasks</strong> — small enough for gaps between site visits. Phases 1–2 (reactivation, GBP, reviews) should be largely done by week 6 without touching a session.</li>
<li><strong>Live deal management</strong> — Rob, Simon, Oli, Black Venn, Brecon continue as normal. Sessions 9 and 11 deliberately use them as test material.</li>
<li><strong>Marketing output</strong> — Irons Empire keeps posting throughout. This build changes what they're fed, not their cadence. Agree the Session 27 handoff route with them in a five-minute call.</li>
<li><strong>Print designer sourcing</strong> — an email or two, not a session. Start early so Session 33 has an answer rather than a task.</li>
</ul>`},
{t:"What failure looks like", h:`
<ol>
<li>Sessions become talking sessions and nothing ships. Fix: end every session by naming the artefact produced.</li>
<li>The Session 2 decision block drags for weeks and everything queues behind it. Fix: imperfect numbers now; all five are revisable.</li>
<li>Wiring skipped because the framework feels finished. A framework nobody is forced to follow decays in a month.</li>
<li>The monthly review gets cancelled when busy. This is the one thing that makes the rest a machine rather than a document set. It's 30–60 minutes. Protect it.</li>
<li>Photography and testimonials captured but never published — the commonest marketing failure in small construction firms. Fix: treat "published", not "captured", as done.</li>
</ol>`}
];

/* ========================= STATE ========================= */
const KEY = "foxtail-systems-build-v1";
let state = { done:{}, open:null, log:[] };
let storageOK = true;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); state = Object.assign({done:{},open:null,log:[]}, p); }
  }catch(e){ storageOK = false; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; renderNote(); }
}

const TICK = '<svg viewBox="0 0 16 16" fill="none"><path d="M2.5 8.5L6 12l7.5-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tid = (n,i) => "s"+n+"t"+i;

const allSessions = BLOCKS.flatMap(b=>b.sessions);
const totalTasks = allSessions.reduce((a,s)=>a+s.tasks.length,0);
const sessDone = s => s.tasks.filter((_,i)=>state.done[tid(s.n,i)]).length;
const sessComplete = s => sessDone(s) === s.tasks.length;
const blockDone = b => b.sessions.reduce((a,s)=>a+sessDone(s),0);
const blockTotal = b => b.sessions.reduce((a,s)=>a+s.tasks.length,0);

function nextSession(){ return allSessions.find(s=>!sessComplete(s)) || null; }
function blockOf(n){ return BLOCKS.find(b=>b.sessions.some(s=>s.n===n)); }

/* ========================= RENDER ========================= */
function renderHeader(){
  const d = allSessions.reduce((a,s)=>a+sessDone(s),0);
  const sd = allSessions.filter(sessComplete).length;
  document.getElementById("dc").textContent = d;
  document.getElementById("tc").textContent = totalTasks;
  document.getElementById("sc").textContent = sd;
  const p = Math.round(d/totalTasks*100);
  document.getElementById("pct").textContent = p+"%";
  document.getElementById("fill").style.width = p+"%";
}

function renderUpNext(){
  const el = document.getElementById("upnext");
  const s = nextSession();
  if(!s){
    el.innerHTML = '<div class="lab">Complete</div><div class="t">All 36 sessions ticked off</div>'+
      '<div class="m">Quarter close done. Set next quarter\'s priorities from the retrospective.</div>';
    return;
  }
  const b = blockOf(s.n);
  el.innerHTML = '<div class="lab">Up next</div>'+
    '<div class="t">Session '+s.n+' · '+esc(s.t)+'</div>'+
    '<div class="m">'+esc(b.sys)+' — '+esc(b.title)+' · '+sessDone(s)+' of '+s.tasks.length+' ticked</div>'+
    '<button id="jump">Open this session</button>';
  const j = document.getElementById("jump");
  if(j) j.addEventListener("click", ()=>{
    state.open = b.id; save(); renderBlocks();
    const node = document.getElementById("sess-"+s.n);
    if(node) node.scrollIntoView({behavior:"smooth", block:"center"});
  });
}

function renderBlocks(){
  const root = document.getElementById("blocks");
  const openId = state.open === "__none__" ? null : (state.open || (blockOf((nextSession()||{n:1}).n)||BLOCKS[0]).id);
  root.innerHTML = "";
  BLOCKS.forEach(b=>{
    const d = blockDone(b), t = blockTotal(b), complete = d===t;
    const el = document.createElement("section");
    el.className = "block"+(openId===b.id?" open":"")+(complete?" complete":"");
    el.innerHTML =
      '<button class="block-head" aria-expanded="'+(openId===b.id)+'">'+
        '<div class="block-top"><span class="block-sys">'+esc(b.sys)+'</span><span class="block-win">'+esc(b.win)+'</span></div>'+
        '<div class="block-title">'+esc(b.title)+' <span class="count">'+d+'/'+t+'</span><span class="chev">▾</span></div>'+
        '<div class="block-bar"><i style="width:'+(t?d/t*100:0)+'%"></i></div>'+
      '</button>'+
      '<div class="block-body"><div class="block-goal">'+esc(b.goal)+'</div>'+
        b.sessions.map(s=>{
          const sd = sessDone(s), done = sd===s.tasks.length;
          return '<div class="sess'+(done?' done':'')+'" id="sess-'+s.n+'">'+
            '<div class="sess-head"><span class="sess-n">Session '+s.n+'</span><span class="sess-t">'+esc(s.t)+'</span><span class="sess-c">'+sd+'/'+s.tasks.length+'</span></div>'+
            (s.intro?'<div class="sess-intro">'+esc(s.intro)+'</div>':'')+
            '<div class="tasks">'+s.tasks.map((tx,i)=>{
              const id = tid(s.n,i), on = !!state.done[id];
              return '<button class="task'+(on?' done':'')+'" data-id="'+id+'" aria-pressed="'+on+'">'+
                '<span class="tick">'+TICK+'</span><span class="tx">'+esc(tx)+'</span></button>';
            }).join('')+'</div>'+
            (s.tags?'<div class="flags">'+s.tags.map(g=>'<span class="tag '+g+'">'+(g==='blocks'?'blocking':g)+'</span>').join('')+'</div>':'')+
          '</div>';
        }).join('')+
      '</div>';
    el.querySelector(".block-head").addEventListener("click", ()=>{
      state.open = (openId===b.id) ? "__none__" : b.id;
      save(); renderBlocks();
    });
    el.querySelectorAll(".task").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.id;
        if(state.done[id]) delete state.done[id]; else state.done[id] = Date.now();
        save(); renderBlocks(); renderHeader(); renderUpNext();
      });
    });
    root.appendChild(el);
  });
}

function renderLog(){
  const list = document.getElementById("logList");
  if(!state.log.length){ list.innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
  list.innerHTML = state.log.map((e,i)=>
    '<div class="entry"><span class="d">'+esc(e.d)+'</span><span class="b">'+esc(e.b)+'</span>'+
    '<button class="x" data-i="'+i+'" aria-label="Delete entry">×</button></div>').join('');
  list.querySelectorAll(".x").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(!confirm("Delete this entry?")) return;
      state.log.splice(+btn.dataset.i,1); save(); renderLog();
    });
  });
}

function renderRef(){
  document.getElementById("viewRef").innerHTML = REFERENCE.map((r,i)=>
    '<section class="ref" data-i="'+i+'"><button>'+esc(r.t)+'<span class="chev">▾</span></button>'+
    '<div class="ref-body">'+r.h+'</div></section>').join('');
  document.querySelectorAll(".ref>button").forEach(btn=>{
    btn.addEventListener("click", ()=>btn.parentElement.classList.toggle("open"));
  });
}

function renderNote(){
  document.getElementById("note").textContent = storageOK
    ? "Progress saved on this device. Export a backup now and then — clearing Safari data wipes it."
    : "Storage unavailable — progress will not persist. Export a backup before closing.";
}

/* tabs */
const views = {tabPlan:"viewPlan", tabLog:"viewLog", tabRef:"viewRef"};
Object.keys(views).forEach(k=>{
  document.getElementById(k).addEventListener("click", ()=>{
    Object.keys(views).forEach(o=>{
      document.getElementById(o).setAttribute("aria-selected", String(o===k));
      document.getElementById(views[o]).hidden = (o!==k);
    });
  });
});

/* log add */
document.getElementById("logAdd").addEventListener("click", ()=>{
  const ta = document.getElementById("logInput");
  const v = ta.value.trim();
  if(!v) return;
  const d = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  state.log.unshift({d, b:v});
  ta.value = ""; save(); renderLog();
});

/* export / import / reset */
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "foxtail-systems-build-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 400);
});
document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("fileIn").click());
document.getElementById("fileIn").addEventListener("change", ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(!p || typeof p !== "object") throw new Error();
      state = Object.assign({done:{},open:null,log:[]}, p);
      save(); renderAll();
      alert("Backup restored.");
    }catch(e){ alert("That file couldn't be read as a backup."); }
    ev.target.value = "";
  };
  r.readAsText(f);
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Clear all ticks and the decisions log? This can't be undone.")) return;
  state = {done:{},open:null,log:[]};
  try{ localStorage.removeItem(KEY); }catch(e){}
  renderAll();
});

function renderAll(){ renderHeader(); renderUpNext(); renderBlocks(); renderLog(); renderNote(); }
load(); renderRef(); renderAll();
</script>
</body>
</html>
